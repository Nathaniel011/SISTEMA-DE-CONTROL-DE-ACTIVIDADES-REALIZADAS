services:
  postgres:
    image: postgres:16-alpine
    container_name: scar-postgres
    environment:
      POSTGRES_DB: scar
      POSTGRES_USER: scar
      POSTGRES_PASSWORD: scar123
    ports:
      - "5432:5432"
    volumes:
      - scar_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scar -d scar"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  scar_pg_data:
