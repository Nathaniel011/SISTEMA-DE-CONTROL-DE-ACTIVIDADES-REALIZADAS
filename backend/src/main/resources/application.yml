spring:
  application:
    name: scar-api
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:scar}
    username: ${DB_USER:scar}
    password: ${DB_PASSWORD:60465524}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /

scar:
  db:
    auto-provision: true
  upload:
    dir: ${UPLOAD_DIR:./uploads}
  webhooks:
    email:
      secret: ${WEBHOOK_EMAIL_SECRET:}
  jwt:
    secret: ${JWT_SECRET:scar-dev-secret-change-in-production-min-256-bits-long-key!!}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:4200}

logging:
  level:
    com.scar: INFO
