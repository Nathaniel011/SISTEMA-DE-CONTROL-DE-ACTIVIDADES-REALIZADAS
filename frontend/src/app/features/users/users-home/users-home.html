<p-card class="p-2">
  <ng-template  #header>
    <p-toolbar class="mb-2 bg-surface-50">
      <ng-template #start>
        <div class="flex items-center gap-2">
          @if (appService.isBaseRoute()) {
            <p-button icon="pi pi-user" text size="large"/>
          } @else {
            <p-button icon="pi pi-arrow-left" size="large" routerLink="/users"/>
          }
          <div class="flex flex-col">
            <span class="text-primary-500 font-bold text-lg">Usuarios</span>
            <span class="text-sm">Administracion de usuarios</span>
          </div>
        </div>
      </ng-template>

      <ng-template #end>
        <p-button label="Nuevo" icon="pi pi-plus" severity="contrast" routerLink="/users/create" />
      </ng-template>
    </p-toolbar>
  </ng-template>
  <ng-template #content class="p-2">
    <router-outlet/>
  </ng-template>
</p-card>
