<p-card>
  <ng-template #content>
    <div class="p-4 flex flex-col gap-4">
      <p-iconfield class="flex-1">
        <p-inputicon class="pi pi-search" />
        <input
          pInputText
          [ngModel]="searchTerm"
          (ngModelChange)="onSearch($event)"
          placeholder="Buscar por código, servicio, categoría o precio"
          class="w-full"
        />
      </p-iconfield>

      <p-table [value]="pagedServices" [tableStyle]="{'min-width': '64rem'}">
        <ng-template #header>
          <tr>
            <th><button type="button" class="users-sort-button" (click)="onSort('code')"><span>Código</span><i [class]="sortIcon('code')"></i></button></th>
            <th><button type="button" class="users-sort-button" (click)="onSort('name')"><span>Servicio</span><i [class]="sortIcon('name')"></i></button></th>
            <th><button type="button" class="users-sort-button" (click)="onSort('category')"><span>Categoría</span><i [class]="sortIcon('category')"></i></button></th>
            <th><button type="button" class="users-sort-button" (click)="onSort('price')"><span>Precio referencial</span><i [class]="sortIcon('price')"></i></button></th>
            <th><button type="button" class="users-sort-button" (click)="onSort('status')"><span>Estado</span><i [class]="sortIcon('status')"></i></button></th>
            <th class="text-right">Acciones</th>
          </tr>
        </ng-template>
        <ng-template #body let-service>
          <tr>
            <td>{{ service.code }}</td>
            <td>{{ service.name }}</td>
            <td>{{ service.category }}</td>
            <td>{{ service.price }}</td>
            <td>
              <p-tag [value]="service.active ? 'Activo' : 'Inactivo'" [severity]="service.active ? 'success' : 'secondary'" />
            </td>
            <td>
              <div class="flex justify-end">
                <p-button label="Ver" icon="pi pi-eye" text [routerLink]="['/service-catalog', service.id, 'show']" />
              </div>
            </td>
          </tr>
        </ng-template>
      </p-table>

      <p-paginator
        [first]="page * rows"
        [rows]="rows"
        [totalRecords]="sortedServices.length"
        [rowsPerPageOptions]="[25, 50, 100]"
        (onPageChange)="onPageChange($event)"
      />
    </div>
  </ng-template>
</p-card>
