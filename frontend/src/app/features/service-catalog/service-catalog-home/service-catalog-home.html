<p-card class="p-2">
  <ng-template #header>
    <p-toolbar class="mb-2 bg-surface-50">
      <ng-template #start>
        <div class="flex items-center gap-2">
          @if (appService.isBaseRoute()) {
            <p-button icon="pi pi-briefcase" text size="large" />
          } @else {
            <p-button icon="pi pi-arrow-left" size="large" routerLink="/service-catalog" />
          }
          <div class="flex flex-col">
            <span class="text-primary-500 font-bold text-lg">Catálogo de servicios</span>
            <span class="text-sm">Configuración de servicios y precios referenciales</span>
          </div>
        </div>
      </ng-template>

      <ng-template #end>
        <p-button label="Nuevo" icon="pi pi-plus" severity="contrast" routerLink="/service-catalog/create" />
      </ng-template>
    </p-toolbar>
  </ng-template>
  <ng-template #content class="p-2">
    <router-outlet />
  </ng-template>
</p-card>
