<p-card>
  <ng-template #header>
    <div class="px-6 pt-6">
      <div class="text-xl font-semibold">Cambiar contraseña</div>
      <div class="text-sm text-surface-500">Interfaz mock para la actualización de credenciales</div>
    </div>
  </ng-template>

  <ng-template #content>
    <form [formGroup]="form" class="grid grid-cols-1 md:grid-cols-2 gap-4 p-6">
      <div class="flex flex-col gap-2 md:col-span-2">
        <label for="current-password" class="font-medium">Contraseña actual</label>
        <p-password inputId="current-password" formControlName="currentPassword" [feedback]="false" [toggleMask]="true" styleClass="w-full" inputStyleClass="w-full" />
      </div>

      <div class="flex flex-col gap-2">
        <label for="new-password" class="font-medium">Nueva contraseña</label>
        <p-password inputId="new-password" formControlName="newPassword" [feedback]="true" [toggleMask]="true" styleClass="w-full" inputStyleClass="w-full" />
      </div>

      <div class="flex flex-col gap-2">
        <label for="confirm-password" class="font-medium">Confirmar contraseña</label>
        <p-password inputId="confirm-password" formControlName="confirmPassword" [feedback]="false" [toggleMask]="true" styleClass="w-full" inputStyleClass="w-full" />
      </div>

      @if (form.hasError('passwordMismatch') && form.touched) {
        <div class="md:col-span-2 text-sm text-red-500">
          La confirmación no coincide con la nueva contraseña.
        </div>
      }

      <div class="md:col-span-2 flex justify-end">
        <p-button label="Actualizar contraseña" icon="pi pi-key" (onClick)="save()" />
      </div>
    </form>
  </ng-template>
</p-card>
