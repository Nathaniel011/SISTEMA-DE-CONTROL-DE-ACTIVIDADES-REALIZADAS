<p-card>
  <ng-template #content>
    <div class="p-4 flex flex-col gap-4">
      <p-iconfield class="flex-1">
        <p-inputicon class="pi pi-search" />
        <input
          pInputText
          [ngModel]="searchTerm"
          (ngModelChange)="onSearch($event)"
          placeholder="Buscar por atención, difunto, documento, servicio o estado"
          class="w-full"
        />
      </p-iconfield>

      <p-table [value]="pagedRecords" [tableStyle]="{'min-width': '78rem'}">
        <ng-template #header>
          <tr>
            <th><button type="button" class="users-sort-button" (click)="onSort('recordNumber')"><span>Nro.</span><i [class]="sortIcon('recordNumber')"></i></button></th>
            <th><button type="button" class="users-sort-button" (click)="onSort('deceasedFullName')"><span>Difunto</span><i [class]="sortIcon('deceasedFullName')"></i></button></th>
            <th><button type="button" class="users-sort-button" (click)="onSort('deceasedDocument')"><span>Documento</span><i [class]="sortIcon('deceasedDocument')"></i></button></th>
            <th><button type="button" class="users-sort-button" (click)="onSort('serviceSummary')"><span>Servicios</span><i [class]="sortIcon('serviceSummary')"></i></button></th>
            <th><button type="button" class="users-sort-button" (click)="onSort('amount')"><span>Monto</span><i [class]="sortIcon('amount')"></i></button></th>
            <th><button type="button" class="users-sort-button" (click)="onSort('status')"><span>Estado</span><i [class]="sortIcon('status')"></i></button></th>
            <th><button type="button" class="users-sort-button" (click)="onSort('createdAt')"><span>Registro</span><i [class]="sortIcon('createdAt')"></i></button></th>
            <th class="text-right">Acciones</th>
          </tr>
        </ng-template>
        <ng-template #body let-record>
          <tr>
            <td>{{ record.recordNumber }}</td>
            <td>{{ record.deceasedFullName }}</td>
            <td>{{ record.deceasedDocument }}</td>
            <td>{{ record.serviceSummary }}</td>
            <td>{{ record.amount }}</td>
            <td>
              <p-tag [value]="record.status" [severity]="statusSeverity(record.status)" />
            </td>
            <td>{{ record.createdAt }}</td>
            <td>
              <div class="flex justify-end">
                <p-button label="Ver" icon="pi pi-eye" text [routerLink]="['/attentions', record.id, 'show']" />
              </div>
            </td>
          </tr>
        </ng-template>
      </p-table>

      <p-paginator
        [first]="page * rows"
        [rows]="rows"
        [totalRecords]="sortedRecords.length"
        [rowsPerPageOptions]="[25, 50, 100]"
        (onPageChange)="onPageChange($event)"
      />
    </div>
  </ng-template>
</p-card>
