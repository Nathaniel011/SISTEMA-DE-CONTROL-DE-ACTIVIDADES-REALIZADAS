<div class="yt-content yt-content-standalone">
  <div class="yt-placeholder">
    <i [class]="icon + ' yt-placeholder-icon'"></i>
    <h1 class="yt-content-title">{{ title }}</h1>
    <p class="text-surface-500 max-w-md text-center m-0">{{ description }}</p>
    <p-button label="Ir a incidencias" icon="pi pi-list" severity="primary" routerLink="/work/issues" class="mt-4" />
  </div>
</div>
