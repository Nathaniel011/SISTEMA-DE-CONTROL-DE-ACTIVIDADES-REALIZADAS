<div class="yt-content yt-content-standalone">
  <div class="yt-content-header">
    <div>
      <h1 class="yt-content-title m-0">Base de conocimiento</h1>
      <p class="text-surface-500 m-0 mt-1">Articulos, procedimientos y decisiones del equipo</p>
    </div>
    <p-button icon="pi pi-plus" label="Articulo" (onClick)="newArticle()" />
  </div>

  <div class="grid grid-cols-1 xl:grid-cols-[22rem_1fr] gap-5 mt-5 min-h-[38rem]">
    <aside class="border border-surface-200 rounded-xl bg-surface-0 overflow-hidden flex flex-col">
      <div class="p-3 border-b border-surface-200 flex flex-col gap-3">
        <input
          pInputText
          type="search"
          placeholder="Buscar"
          class="w-full"
          [ngModel]="query()"
          (ngModelChange)="query.set($event); applyFilters()"
        />
        <p-select
          [options]="boardFilterOptions()"
          [ngModel]="selectedBoardId()"
          (ngModelChange)="selectedBoardId.set($event); applyFilters()"
          optionLabel="label"
          optionValue="value"
          class="w-full"
        />
      </div>

      @if (loading()) {
        <div class="flex justify-center py-10">
          <p-progressSpinner />
        </div>
      } @else {
        <div class="overflow-y-auto">
          @for (article of visibleArticles(); track article.id) {
            <button
              type="button"
              class="w-full text-left border-0 bg-transparent cursor-pointer px-4 py-3 border-b border-surface-100 hover:bg-surface-50"
              [class.bg-primary-50]="article.id === selectedArticleId()"
              (click)="selectArticle(article)"
            >
              <div class="font-semibold text-sm text-surface-900 truncate">{{ article.title }}</div>
              <div class="text-xs text-surface-500 mt-1 flex items-center gap-2">
                <span>{{ article.projectName ?? 'General' }}</span>
                <span>{{ formatDate(article.updatedAt) }}</span>
              </div>
              <div class="flex items-center gap-1 mt-2 flex-wrap">
                <p-tag [value]="statusLabel(article.status)" severity="secondary" />
                @for (tag of article.tags; track tag) {
                  <span class="work-label-chip py-0.5 px-2">{{ tag }}</span>
                }
              </div>
            </button>
          } @empty {
            <div class="text-sm text-surface-500 p-4">No hay articulos.</div>
          }
        </div>
      }
    </aside>

    <section class="border border-surface-200 rounded-xl bg-surface-0 overflow-hidden flex flex-col min-w-0">
      <div class="p-4 border-b border-surface-200 grid grid-cols-1 lg:grid-cols-[1fr_14rem_11rem_auto] gap-3">
        <input
          pInputText
          class="w-full font-semibold"
          [ngModel]="editorTitle()"
          (ngModelChange)="editorTitle.set($event)"
        />
        <p-select
          [options]="boardEditorOptions()"
          [ngModel]="editorBoardId()"
          (ngModelChange)="editorBoardId.set($event)"
          optionLabel="label"
          optionValue="value"
          class="w-full"
        />
        <p-select
          [options]="statusOptions"
          [ngModel]="editorStatus()"
          (ngModelChange)="editorStatus.set($event)"
          optionLabel="label"
          optionValue="value"
          class="w-full"
        />
        <div class="flex items-center gap-2">
          <p-button icon="pi pi-save" label="Guardar" [loading]="saving()" (onClick)="saveArticle()" />
          <p-button
            icon="pi pi-trash"
            severity="danger"
            [text]="true"
            [disabled]="editingNew()"
            (onClick)="deleteArticle()"
          />
        </div>
      </div>

      <div class="p-4 border-b border-surface-200">
        <input
          pInputText
          class="w-full"
          placeholder="Tags separados por coma"
          [ngModel]="editorTags()"
          (ngModelChange)="editorTags.set($event)"
        />
      </div>

      <div class="grid grid-cols-1 xl:grid-cols-2 gap-0 flex-1 min-h-0">
        <textarea
          pTextarea
          rows="20"
          class="w-full h-full min-h-[32rem] border-0 rounded-none resize-none"
          [ngModel]="editorContent()"
          (ngModelChange)="editorContent.set($event)"
        ></textarea>
        <article class="border-t xl:border-t-0 xl:border-l border-surface-200 p-5 overflow-y-auto">
          <h2 class="text-xl font-semibold m-0 mb-3">{{ editorTitle() }}</h2>
          <div class="flex items-center gap-2 mb-4 flex-wrap">
            <p-tag [value]="statusLabel(editorStatus())" severity="secondary" />
            @for (tag of parseTags(editorTags()); track tag) {
              <span class="work-label-chip">{{ tag }}</span>
            }
          </div>
          <div class="text-sm leading-6 whitespace-pre-wrap text-surface-700">{{ editorContent() }}</div>
        </article>
      </div>
    </section>
  </div>
</div>
