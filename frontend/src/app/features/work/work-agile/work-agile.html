<div class="yt-content yt-content-standalone">
  <div class="yt-content-header">
    <h1 class="yt-content-title m-0">Tableros</h1>
    <p-button label="Nuevo tablero" icon="pi pi-plus" severity="primary" (onClick)="openCreate()" />
  </div>
  <p class="text-surface-500">Selecciona un tablero para abrir su vista Kanban o crea uno nuevo.</p>
  <div class="flex flex-col gap-2 mt-4 max-w-md">
    @for (board of workService.boards(); track board.id) {
      <a [routerLink]="['/work/agile', board.id]" class="yt-subnav-link justify-between no-underline">
        <span>{{ board.name }}</span>
        <i class="pi pi-arrow-right"></i>
      </a>
    }
  </div>

  <p-dialog header="Nuevo tablero" [modal]="true" [style]="{ width: '28rem' }" [visible]="createDialogOpen()" (visibleChange)="createDialogOpen.set($event)">
    <div class="flex flex-col gap-4 pt-2">
      <input pInputText placeholder="Nombre" class="w-full" [ngModel]="boardName()" (ngModelChange)="boardName.set($event)" />
      <input pInputText placeholder="Clave (ARG)" class="w-full" maxlength="4" [ngModel]="boardKey()" (ngModelChange)="boardKey.set($event)" />
      <textarea pTextarea rows="3" placeholder="Descripción" class="w-full" [ngModel]="boardDescription()" (ngModelChange)="boardDescription.set($event)"></textarea>
      <p-select
        [options]="parentBoardOptions()"
        optionLabel="label"
        optionValue="value"
        [ngModel]="parentBoardId()"
        (ngModelChange)="parentBoardId.set($event)"
        placeholder="Tablero padre"
        class="w-full"
      />
    </div>
    <ng-template #footer>
      <p-button label="Cancelar" severity="secondary" text (onClick)="createDialogOpen.set(false)" />
      <p-button label="Crear" icon="pi pi-check" (onClick)="saveBoard()" />
    </ng-template>
  </p-dialog>
</div>
