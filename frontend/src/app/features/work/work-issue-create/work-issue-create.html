
<p-dialog header="Nueva incidencia" [visible]="visible()" (visibleChange)="visible.set($event)"
  [modal]="true" [draggable]="false" [closable]="!saving()" [closeOnEscape]="!saving()"
  [style]="{width: 'min(94vw, 32rem)'}">
  <form class="grid gap-3" (ngSubmit)="create()">
    <label for="create-issue-board" class="font-semibold">Proyecto</label>
    <p-select inputId="create-issue-board" name="board" ariaLabel="Proyecto" [options]="boards()" [ngModel]="boardId()"
      (ngModelChange)="boardId.set($event)" [disabled]="lockedBoard() || saving()" [fluid]="true"
      placeholder="Seleccionar proyecto" appendTo="body" />
    <label for="create-issue-title" class="font-semibold">Asunto</label>
    <app-work-writing-field inputId="create-issue-title" label="Asunto" [required]="true"
      [(value)]="title" [disabled]="saving()" placeholder="Describe el trabajo en una línea" />
    <label for="create-issue-description" class="font-semibold">Descripción</label>
    <app-work-writing-field inputId="create-issue-description" label="Descripción" [rows]="4" [maxLength]="10000"
      [(value)]="description" [disabled]="saving()" placeholder="Contexto, pasos o resultado esperado" />
    @if (fieldsLoading()) {
      <p role="status" class="m-0 text-sm text-surface-600">Cargando campos del proyecto…</p>
    } @else if (fieldsError()) {
      <p role="alert" class="m-0 text-sm text-red-700">No se pudieron cargar los campos del proyecto.</p>
      <p-button label="Reintentar" severity="secondary" [text]="true" (onClick)="loadFields(boardId())" />
    } @else if (fields().length) {
      <app-work-project-fields class="grid gap-3" prefix="new-field" [fields]="fields()" [values]="fieldValues()"
        [disabled]="saving()" (changed)="setField($event.id, $event.value)" />
    }
    @if (error()) {
      <p class="m-0 text-red-700" role="alert">{{ error() }}</p>
    }
    <div class="flex justify-end gap-2">
      <p-button label="Cancelar" severity="secondary" [text]="true" [disabled]="saving()" (onClick)="visible.set(false)" />
      <p-button type="submit" label="Crear incidencia" ariaLabel="Crear incidencia" icon="pi pi-check" [loading]="saving()"
        [disabled]="!boardId() || !title().trim() || fieldsLoading() || fieldsError()" />
    </div>
  </form>
</p-dialog>
