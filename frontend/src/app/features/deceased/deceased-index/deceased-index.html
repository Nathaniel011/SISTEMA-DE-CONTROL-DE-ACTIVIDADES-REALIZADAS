<p-card>
  <ng-template #content>
    <div class="p-4 flex flex-col gap-4">
      <p-iconfield class="flex-1">
        <p-inputicon class="pi pi-search" />
        <input
          pInputText
          [ngModel]="searchTerm"
          (ngModelChange)="onSearch($event)"
          placeholder="Buscar por apellidos, nombres, documento o fecha"
          class="w-full"
        />
      </p-iconfield>

      <p-table [value]="pagedRecords" [tableStyle]="{'min-width': '72rem'}">
        <ng-template #header>
          <tr>
            <th><button type="button" class="users-sort-button" (click)="onSort('paternalSurname')"><span>Primer apellido</span><i [class]="sortIcon('paternalSurname')"></i></button></th>
            <th><button type="button" class="users-sort-button" (click)="onSort('maternalSurname')"><span>Segundo apellido</span><i [class]="sortIcon('maternalSurname')"></i></button></th>
            <th><button type="button" class="users-sort-button" (click)="onSort('names')"><span>Nombres</span><i [class]="sortIcon('names')"></i></button></th>
            <th><button type="button" class="users-sort-button" (click)="onSort('documentNumber')"><span>Documento</span><i [class]="sortIcon('documentNumber')"></i></button></th>
            <th><button type="button" class="users-sort-button" (click)="onSort('deathDate')"><span>Fecha defunción</span><i [class]="sortIcon('deathDate')"></i></button></th>
            <th class="text-right">Acciones</th>
          </tr>
        </ng-template>
        <ng-template #body let-record>
          <tr>
            <td>{{ record.paternalSurname }}</td>
            <td>{{ record.maternalSurname }}</td>
            <td>{{ record.names }}</td>
            <td>{{ record.documentNumber }}</td>
            <td>{{ record.deathDate }}</td>
            <td>
              <div class="flex justify-end">
                <p-button label="Ver" icon="pi pi-eye" text [routerLink]="['/deceased', record.id, 'show']" />
              </div>
            </td>
          </tr>
        </ng-template>
      </p-table>

      <p-paginator
        [first]="page * rows"
        [rows]="rows"
        [totalRecords]="sortedRecords.length"
        [rowsPerPageOptions]="[25, 50, 100]"
        (onPageChange)="onPageChange($event)"
      />
    </div>
  </ng-template>
</p-card>
