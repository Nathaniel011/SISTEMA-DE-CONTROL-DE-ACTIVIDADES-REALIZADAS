<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>SCAR</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Apply the saved appearance before the prerendered page can paint. -->
  <script>
    (() => {
      let preference;
      try { preference = localStorage.getItem('scar-theme'); } catch {}
      const dark = preference === 'dark' || (preference !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.classList.toggle('scar-dark', dark);
    })();
  </script>
  <style>
    html { color-scheme: light; }
    html.scar-dark { color-scheme: dark; background-color: #101b20; color: #deeaeb; }
  </style>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>
<body class="bg-surface-100 text-surface-700 font-normal">
  <app-root><p role="status" style="margin:2rem;font:1rem system-ui,sans-serif">Cargando SCAR…</p></app-root>
</body>
</html>
