receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 350
    spike_limit_mib: 70
  tail_sampling:
    decision_wait: 10s
    num_traces: 10000
    policies:
      - name: slow
        type: latency
        latency:
          threshold_ms: 800
      - name: error
        type: status_code
        status_code:
          status_codes: [ERROR]
      - name: regular
        type: probabilistic
        probabilistic:
          sampling_percentage: 5
  transform/private_urls:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          - delete_key(span.attributes, "url.full")
          - delete_key(span.attributes, "url.path")
          - delete_key(span.attributes, "url.query")
          - delete_key(span.attributes, "http.target")
          - delete_key(span.attributes, "http.url")
  batch: {}
exporters:
  debug:
    verbosity: basic
  prometheus:
    endpoint: 0.0.0.0:9464
service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, transform/private_urls, tail_sampling, batch]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus]
